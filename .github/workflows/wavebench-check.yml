name: Wavebench checks
on:
  push:
    branches: [main]
    paths: ['wavebench/**', '.github/workflows/wavebench-check.yml']
  pull_request:
    paths: ['wavebench/**', '.github/workflows/wavebench-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wavebench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wavebench/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wavebench-browser-results
          path: wavebench/test-results/
